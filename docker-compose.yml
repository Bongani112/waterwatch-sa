services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waterwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterwatch}
      POSTGRES_DB: ${POSTGRES_DB:-waterwatch}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waterwatch}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-waterwatch}:${POSTGRES_PASSWORD:-waterwatch}@db:5432/${POSTGRES_DB:-waterwatch}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
  uploads:
